<div class="shell">
  <form class="card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="head">
      <h1>Sign in</h1>
      <p class="muted">The catalogue is available to signed-in staff only.</p>
    </div>

    @if (error(); as message) {
      <p class="banner" role="alert">{{ message }}</p>
    }

    <app-field label="Username" [error]="isInvalid('username') ? errorFor('username') : null">
      <input
        type="text"
        formControlName="username"
        autocomplete="username"
        autocapitalize="none"
        spellcheck="false"
        required
        [attr.aria-invalid]="isInvalid('username')"
      />
    </app-field>

    <app-field label="Password" [error]="isInvalid('password') ? errorFor('password') : null">
      <input
        type="password"
        formControlName="password"
        autocomplete="current-password"
        required
        [attr.aria-invalid]="isInvalid('password')"
      />
    </app-field>

    <button appButton variant="primary" type="submit" [disabled]="pending()">
      {{ pending() ? 'Signing in…' : 'Sign in' }}
    </button>

    @if (showDevAccounts) {
      <p class="hint">
        Development accounts —
        <span class="code">distributor / Distributor#123</span> (full access),
        <span class="code">viewer / Viewer#123</span> (read-only).
      </p>
    }
  </form>
</div>
