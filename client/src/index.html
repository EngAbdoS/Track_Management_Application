<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Track Manager</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script>
    // Applies a stored theme choice before the first paint. Without it the page
    // renders one frame with the OS theme and then flips once Angular boots.
    try {
      var theme = localStorage.getItem('tm.theme');
      if (theme === 'light' || theme === 'dark') {
        document.documentElement.setAttribute('data-theme', theme);
      }
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
